# ═══════════════════════════════════════════════════════════
# 竞价策略配置文件 (strategy_config.ini)
# 适用于任何JPES标准算例, 修改路径即可切换算例
# ═══════════════════════════════════════════════════════════

[case]
# 算例名称 (用于输出文件命名)
name = ROTS 44
# 数据根目录 (留空则自动计算相对路径: ROTS44_delivery/code -> Case/ROTS 44)
base_dir = 
# 标准算例文件 (用于提取机组参数)
standard_case = 标准算例-JPES-ROTS-44.xlsm
# 子目录
input_subdir = Input
output_subdir = Output

[data]
# Step1生成的预测文件
predictions_file = price_predictions_all91.csv
# 数据提取脚本生成的汇总文件
timeseries_file = summary_timeseries.csv
daily_file = summary_daily.csv
revenue_file = summary_revenue.csv

[dates]
# 训练期 (用于学习策略参数)
train_start = 20260101
train_end = 20260318
# 策略应用期 (生成新报价的日期)
apply_start = 20260319
apply_end = 20260401

[strategy]
# 策略目标: company_revenue(每个公司收益最大化)
objective = company_revenue
# 加价率搜索范围
markup_min = -0.20
markup_max = 0.80
markup_step = 0.02
# 报量分配模式: aggressive(前端加载) / balanced(均匀) / adaptive(自适应)
quantity_mode = adaptive
# 燃料价格(元/吨标准煤), 0=从算例文件读取
fuel_price = 0

[output]
# 输出目录 (相对于base_dir)
output_subdir = strategy_output
# 是否生成修改后的xlsm文件
write_xlsm = true
# 是否生成对比报告
write_report = true